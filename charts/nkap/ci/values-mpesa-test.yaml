# Values for CI's M-Pesa assertions: one M-Pesa installation, Kenya, the only slot the gateway
# has. Secret names only, no credential values -- as in values-test.yaml. Not meant to be
# installed anywhere.
image:
  tag: "1.0.0"

database:
  host: postgresql.default.svc.cluster.local
  existingSecret: nkap-db

publicBaseUrl: "https://nkap.example.com"

provider:
  mpesa:
    installations:
      - country: ke
        currency: KES
        baseUrl: "https://sandbox.safaricom.co.ke"
        businessShortCode: "174379"
        existingSecret: nkap-mpesa-ke

keyInit:
  merchantId: acme
