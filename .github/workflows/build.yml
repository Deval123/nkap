name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B --no-transfer-progress clean verify -Dnkap.docker.required=true

  # Separate from `build` so a compose failure names itself. The quick start is the most
  # fragile artifact in the repository — it breaks on a base-image change, a port
  # collision, a property rename — and the first thing every newcomer runs. Something not
  # exercised by CI stops working without anyone noticing.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the images and start the stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Run the quick-start demo
        run: ./examples/demo.sh
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # docs/integration-guide.md is documentation this repository executes rather than merely
  # publishes (issue #88) -- the same "something not exercised by CI stops working without
  # anyone noticing" reasoning as `demo` above, and a separate job for the same reason `demo`
  # is separate from `build`: a guide that stops matching the API should fail on its own line,
  # not get lost inside an unrelated job's log. examples/run-integration-guide.sh extracts and
  # runs every ```bash block in the guide, in order, against a real stack; it needs a fresh
  # one of its own (a stray webhook-receiver container or a merchant with the demo's own
  # already-used idempotency keys is a mess `demo`'s own teardown should not have to know
  # about).
  integration-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the images and start the stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Run the integration guide
        run: ./examples/run-integration-guide.sh
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: |
          docker rm -f guide-webhook-receiver 2>/dev/null || true
          docker compose down -v

  # The version and "does latest move" decision release.yml delegates to
  # .github/scripts/compute-release-tags.sh (issue #103) is the one part of the release path
  # that used to be untestable without an actual tag push or workflow_dispatch run -- three
  # lines of shell wrong by one character, found only by firing the workflow for real. This
  # job is that test instead: no tag, no registry, no Docker, just the script's own rule
  # (a real tag push with no pre-release suffix moves latest; nothing else does) asserted
  # directly. Fast enough to run on every push and pull request, unlike `helm` or `demo`.
  release-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./.github/scripts/compute-release-tags.test.sh

  # ADR 0012 and CONTRIBUTING.md's License section both say every commit is certified by the
  # DCO ("git commit -s") -- a rule written down in two places and, until now, checked in
  # neither: one of the four outside contributions merged so far carries no Signed-off-by
  # trailer at all, and nothing at merge time caught it (issue #155). check-dco.sh is that
  # check; its own comment has the rule, including the deliberate choice to match a trailer
  # against its commit's author by name as well as by email. No Docker, fast, like
  # release-tags above -- but unlike it, this only means anything against a pull request's own
  # commit range, so it needs full history (fetch-depth: 0).
  #
  # The range is origin/<base ref>..<head sha>, not <base sha>..<head sha> (issue #159):
  # github.event.pull_request.base.sha is the base branch's tip at event time, a moving
  # target, not a fixed ancestor of this branch. If a contributor merges the base branch into
  # their own, the commits that merge brings are reachable from head but not from that stale
  # base.sha, and land inside the range as false positives on commits already merged and
  # already checked -- friction aimed squarely at outside contributors for doing something
  # ordinary. Diffing against the base ref itself excludes everything already on it, whatever
  # the branch's topology, because those commits arrived through a pull request this check
  # already ran on, or predate the check.
  #
  # Checked, not assumed: fetch-depth: 0 already leaves origin/<base ref> present (its own
  # fetch log shows "* [new branch] main -> origin/main" on a real run of this job). The
  # explicit fetch below is therefore belt-and-braces, not load-bearing -- cheap insurance
  # against that checkout behaviour ever changing, not a step this job is currently relying on.
  #
  # This job failing does not by itself block a merge; making it required is a repository
  # ruleset setting, not something a workflow file can do.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git fetch origin "${{ github.event.pull_request.base.ref }}"
      - run: ./.github/scripts/check-dco.test.sh
      - run: ./.github/scripts/check-dco.sh "origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }}"

  # Issue #123: compose.yaml and nkap-standalone.compose.yaml must never resolve to the same
  # Compose project, or a volume either declares can become the exact same volume. This is a
  # text-level fact about the two files, not a rule that needs `demo`'s built stack, so it
  # gets its own fast job for the same reason `release-tags` does — `docker compose config`
  # resolves the merged configuration and needs no running daemon.
  compose-project-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./.github/scripts/compose-project-names.test.sh

  # A chart CI never renders is a chart nobody has checked since the day it was written --
  # the same "something not exercised by CI stops being true" reasoning as `demo` and
  # `integration-guide` above, applied to charts/nkap. This does not install into a real
  # cluster; charts/nkap/README.md's own "What CI checks, and what it does not" section says
  # so and names exactly what that leaves unproven, rather than letting the gap go unsaid.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: "v4.3.0"

      - run: helm lint charts/nkap -f charts/nkap/ci/values-test.yaml
      - run: helm lint charts/nkap -f charts/nkap/ci/values-mpesa-test.yaml
      - run: helm lint charts/nkap -f charts/nkap/ci/values-mpesa-env-test.yaml

      # Rendering with no values at all must fail, naming what is missing, rather than
      # producing a Deployment whose Secret references point at nothing -- the credential
      # rule charts/nkap/README.md states is only real if this is what actually happens.
      - name: Assert rendering fails, naming what is missing, when no credentials are supplied
        run: |
          if helm template ci-test charts/nkap >/tmp/should-fail.out 2>/tmp/should-fail.err; then
            echo "::error::helm template succeeded with no values supplied at all -- it must fail and name what is missing"
            exit 1
          fi
          if ! grep -q "is required" /tmp/should-fail.err; then
            echo "::error::helm template failed, but not with a message naming what is required:"
            cat /tmp/should-fail.err
            exit 1
          fi

      - name: Render with test values (Secret names only, no credential values)
        run: helm template ci-test charts/nkap -f charts/nkap/ci/values-test.yaml > /tmp/rendered.yaml

      - name: Assert the traffic Service exposes 8080 and never the management port
        run: |
          service="$(helm template ci-test charts/nkap -f charts/nkap/ci/values-test.yaml -s templates/service.yaml)"
          if ! grep -q "port: 8080" <<< "$service"; then
            echo "::error::the traffic Service does not expose 8080"
            exit 1
          fi
          if grep -q "9464" <<< "$service"; then
            echo "::error::the traffic Service exposes the management port (9464) -- see charts/nkap/README.md's \"The management port\""
            exit 1
          fi

      - name: Assert both probes target the management port, not the traffic port
        run: |
          deployment="$(helm template ci-test charts/nkap -f charts/nkap/ci/values-test.yaml -s templates/deployment.yaml)"
          probe_count="$(grep -c 'port: management' <<< "$deployment")"
          if [ "$probe_count" -lt 2 ]; then
            echo "::error::expected both livenessProbe and readinessProbe to target the management port; found ${probe_count} reference(s)"
            exit 1
          fi
          if ! grep -q 'containerPort: 9464' <<< "$deployment"; then
            echo "::error::the management container port is not 9464"
            exit 1
          fi

      # Every credential-bearing variable must be a Secret reference, never a literal --
      # checked structurally (the line right after every "- name: <VAR>" must be
      # "valueFrom:", for every occurrence: the same variable is set in both the Deployment
      # and the key-init Job), not by guessing at what a leaked value would look like.
      - name: Assert every credential env var is sourced from a Secret, never inline
        run: |
          for var in NKAP_DB_PASSWORD \
                     NKAP_PROVIDER_MTN_CM_SUBSCRIPTION_KEY NKAP_PROVIDER_MTN_CM_API_USER NKAP_PROVIDER_MTN_CM_API_KEY \
                     NKAP_PROVIDER_MTN_CM_DISBURSEMENT_SUBSCRIPTION_KEY NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_USER NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_KEY; do
            next_lines="$(awk -v v="- name: ${var}" '{ line=$0; gsub(/^[ \t]+/, "", line); if (line == v) { getline nxt; gsub(/^[ \t]+/, "", nxt); print nxt } }' /tmp/rendered.yaml)"
            if [ -z "$next_lines" ]; then
              echo "::error::${var} was not found in the rendered output at all"
              exit 1
            fi
            if grep -qv '^valueFrom:$' <<< "$next_lines"; then
              echo "::error::${var} is not sourced from a Secret in every occurrence (found: $(tr '\n' '|' <<< "$next_lines"))"
              exit 1
            fi
          done

      # M-Pesa (issue #217). The gateway has one M-Pesa slot, Kenya, and an M-Pesa installation
      # needs nkap.public-base-url; the chart refuses at render time what the gateway would
      # either crash on or silently not read. Each case must fail, and name what is wrong.
      - name: Assert M-Pesa rendering fails, naming what is wrong, for each incomplete or unreadable installation
        run: |
          values=charts/nkap/ci/values-mpesa-test.yaml
          expect_failure() {
            local expected="$1"; shift
            if helm template ci-test charts/nkap -f "$values" "$@" >/dev/null 2>/tmp/mpesa.err; then
              echo "::error::helm template succeeded with $* -- it must fail naming: ${expected}"
              exit 1
            fi
            if ! grep -qF -- "$expected" /tmp/mpesa.err; then
              echo "::error::helm template failed with $*, but without naming: ${expected}"
              cat /tmp/mpesa.err
              exit 1
            fi
          }
          for field in country currency baseUrl businessShortCode existingSecret; do
            expect_failure "provider.mpesa.installations[0].${field} is required" --set "provider.mpesa.installations[0].${field}="
          done
          expect_failure "publicBaseUrl is required once an M-Pesa installation is configured" --set publicBaseUrl=
          expect_failure "nkap.public-base-url" --set publicBaseUrl=
          expect_failure "only M-Pesa slot is Kenya" --set 'provider.mpesa.installations[0].country=tz'
          expect_failure "businessShortCode must be quoted" --set-json 'provider.mpesa.installations[0].businessShortCode=7234567'
          cat > /tmp/two-mpesa.yaml <<'VALUES'
          provider:
            mpesa:
              installations:
                - {country: ke, currency: KES, baseUrl: "https://a.invalid", businessShortCode: "1", existingSecret: a}
                - {country: ke, currency: KES, baseUrl: "https://b.invalid", businessShortCode: "2", existingSecret: b}
          VALUES
          expect_failure "at most one is allowed" -f /tmp/two-mpesa.yaml
          expect_failure "not known to mean anything" -f /tmp/two-mpesa.yaml

      - name: Render with M-Pesa test values (Secret names only, no credential values)
        run: |
          helm template ci-test charts/nkap -f charts/nkap/ci/values-mpesa-test.yaml > /tmp/rendered-mpesa.yaml
          helm template ci-test charts/nkap -f charts/nkap/ci/values-mpesa-env-test.yaml > /tmp/rendered-mpesa-env.yaml

      - name: Assert the M-Pesa render sets the Kenya slot and the public base URL
        run: |
          for pair in NKAP_PUBLIC_BASE_URL=https://nkap.example.com \
                      NKAP_PROVIDER_MPESA_KE_COUNTRY=ke NKAP_PROVIDER_MPESA_KE_CURRENCY=KES \
                      NKAP_PROVIDER_MPESA_KE_BASE_URL=https://sandbox.safaricom.co.ke \
                      NKAP_PROVIDER_MPESA_KE_BUSINESS_SHORT_CODE=174379 NKAP_PROVIDER_MPESA_KE_REQUEST_TIMEOUT=PT20S; do
            var="${pair%%=*}"; expected="${pair#*=}"
            values="$(awk -v v="- name: ${var}" '{ line=$0; gsub(/^[ \t]+/, "", line); if (line == v) { getline nxt; gsub(/^[ \t]+/, "", nxt); print nxt } }' /tmp/rendered-mpesa.yaml)"
            if [ -z "$values" ] || grep -qvxF "value: \"${expected}\"" <<< "$values"; then
              echo "::error::${var} should be \"${expected}\" in every occurrence (found: $(tr '\n' '|' <<< "$values"))"
              exit 1
            fi
          done

      # The one mistake that would not otherwise be visible: a credential rendered as a literal.
      # Two checks. The named three must be secretKeyRefs, in every occurrence. And, so a
      # credential added later cannot slip past a list nobody updated, no variable whose name
      # looks like a credential may be followed by a plain "value:" anywhere in the render.
      - name: Assert every M-Pesa credential is a Secret reference and no credential renders as a literal
        run: |
          # The three M-Pesa credentials are variables only with credentialsAs: env; by default
          # they are files, asserted in the next step. The database password is a variable in both.
          for pair in /tmp/rendered-mpesa-env.yaml:NKAP_PROVIDER_MPESA_KE_CONSUMER_KEY \
                      /tmp/rendered-mpesa-env.yaml:NKAP_PROVIDER_MPESA_KE_CONSUMER_SECRET \
                      /tmp/rendered-mpesa-env.yaml:NKAP_PROVIDER_MPESA_KE_PASSKEY \
                      /tmp/rendered-mpesa.yaml:NKAP_DB_PASSWORD /tmp/rendered-mpesa-env.yaml:NKAP_DB_PASSWORD; do
            rendered="${pair%%:*}"; var="${pair#*:}"
            next_lines="$(awk -v v="- name: ${var}" '{ line=$0; gsub(/^[ \t]+/, "", line); if (line == v) { getline nxt; gsub(/^[ \t]+/, "", nxt); print nxt } }' "$rendered")"
            if [ -z "$next_lines" ]; then
              echo "::error::${var} was not found in ${rendered} at all"
              exit 1
            fi
            if grep -qv '^valueFrom:$' <<< "$next_lines"; then
              echo "::error::${var} is not sourced from a Secret in every occurrence in ${rendered} (found: $(tr '\n' '|' <<< "$next_lines"))"
              exit 1
            fi
          done
          for rendered in /tmp/rendered-mpesa.yaml /tmp/rendered-mpesa-env.yaml /tmp/rendered.yaml; do
            literals="$(awk '{ line=$0; gsub(/^[ \t]+/, "", line); if (line ~ /^- name: NKAP_[A-Z0-9_]*(KEY|SECRET|PASSKEY|PASSWORD|API_USER)$/) { name=line; getline nxt; gsub(/^[ \t]+/, "", nxt); if (nxt ~ /^value:/) print name } }' "$rendered")"
            if [ -n "$literals" ]; then
              echo "::error::credential variables rendered as literal values in ${rendered}: $(tr '\n' ' ' <<< "$literals")"
              exit 1
            fi
          done

      # M-Pesa's credentials as files, the default. The gateway refuses to start when one name
      # is both a variable and a file, so the three variables must be absent wherever the files
      # are mounted: a check on the volume alone would pass while the gateway refused to start.
      # Both workloads, because the key-init Job starts the same application context.
      - name: Assert M-Pesa credentials render as mounted files by default, and not also as variables
        run: |
          for template in deployment keyinit-job; do
            out="$(helm template ci-test charts/nkap -f charts/nkap/ci/values-mpesa-test.yaml -s "templates/${template}.yaml")"
            if [ "$(grep -c 'name: mpesa-ke-credentials' <<< "$out")" -ne 2 ]; then
              echo "::error::${template}: expected the mpesa-ke-credentials volume and its mount"
              exit 1
            fi
            for var in NKAP_PROVIDER_MPESA_KE_CONSUMER_KEY NKAP_PROVIDER_MPESA_KE_CONSUMER_SECRET NKAP_PROVIDER_MPESA_KE_PASSKEY; do
              if ! grep -qE "^ *path: ${var}$" <<< "$out"; then
                echo "::error::${template}: no volume item with path ${var}"
                exit 1
              fi
              if grep -qE "^ *- name: ${var}$" <<< "$out"; then
                echo "::error::${template}: ${var} is rendered as a variable as well as a file -- the gateway refuses to start"
                exit 1
              fi
            done
            mount="$(awk '/^ *mountPath: / { print $2 }' <<< "$out")"
            dir="$(awk '{ line=$0; gsub(/^[ \t]+/, "", line); if (line == "- name: NKAP_SECRETS_DIR") { getline nxt; gsub(/^[ \t]+/, "", nxt); print nxt } }' <<< "$out")"
            if [ -z "$mount" ] || [ "$dir" != "value: \"${mount}\"" ]; then
              echo "::error::${template}: the credential mount (${mount}) and NKAP_SECRETS_DIR (${dir}) disagree"
              exit 1
            fi
          done

      - name: Assert credentialsAs env renders the three variables and no credential volume
        run: |
          if grep -qE 'mpesa-ke-credentials|^ *volumes:' /tmp/rendered-mpesa-env.yaml; then
            echo "::error::credentialsAs: env still rendered a credential volume"
            exit 1
          fi
          for var in NKAP_PROVIDER_MPESA_KE_CONSUMER_KEY NKAP_PROVIDER_MPESA_KE_CONSUMER_SECRET NKAP_PROVIDER_MPESA_KE_PASSKEY; do
            if [ "$(grep -cE "^ *- name: ${var}$" /tmp/rendered-mpesa-env.yaml)" -ne 2 ]; then
              echo "::error::credentialsAs: env should render ${var} in the Deployment and the key-init Job"
              exit 1
            fi
          done

      - name: Assert an unknown credentialsAs fails rendering, naming the allowed values
        run: |
          if helm template ci-test charts/nkap -f charts/nkap/ci/values-mpesa-test.yaml \
               --set 'provider.mpesa.installations[0].credentialsAs=file' >/dev/null 2>/tmp/credentials-as.err; then
            echo "::error::helm template succeeded with credentialsAs=file -- it must fail naming the allowed values"
            exit 1
          fi
          for expected in 'credentialsAs is "file"' '"files"' '"env"'; do
            if ! grep -qF -- "$expected" /tmp/credentials-as.err; then
              echo "::error::the credentialsAs failure does not name ${expected}:"
              cat /tmp/credentials-as.err
              exit 1
            fi
          done

      - name: Assert an MTN-only render carries nothing of M-Pesa's and no public base URL
        run: |
          if grep -qE 'NKAP_PROVIDER_MPESA_|NKAP_PUBLIC_BASE_URL' /tmp/rendered.yaml; then
            echo "::error::the MTN-only render (values-test.yaml) gained M-Pesa or public-base-url variables it did not ask for"
            exit 1
          fi
