# Dependabot, for SECURITY updates only (issue #280).
#
# A weekly stream of version-bump pull requests is not what is wanted here: the point is a pull
# request when a dependency in the tree has a known vulnerability and a fixed version exists,
# and nothing otherwise. `open-pull-requests-limit: 0` is how GitHub says that. It stops version
# updates and leaves security updates alone, which keep their own limit.
#
# This file only says what to update and where. Security updates themselves are switched on in
# the repository's settings (Settings -> Code security -> Dependabot alerts, then Dependabot
# security updates), not in any file, and without them this file does nothing. The scan in
# .github/workflows/vulnerability-check.yml is independent of both: it fails on a CVSS of 7 or
# more whether or not a fixed version exists, and says so in its report.
#
# `schedule` is required by the format even when no version update is allowed.
version: 2
updates:
  # The root POM and the modules under it, which is the tree the published images ship.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # The base image the three published images run on, and the one entry in this file that is NOT
  # security-only (issue #288, narrowed by #298).
  #
  # What it raises: a newer release of the runtime base inside Java 21 (21.0.x), monthly, three
  # pull requests at most. The pin is exact on purpose (a full `21.x.y_b-jre-alpine` tag), so it
  # only moves when something moves it, and this is that something. A bump arrives with no
  # vulnerability verdict before it merges, because .github/workflows/image-scan.yml reads
  # published images and not branch builds.
  #
  # What it will never raise, and each of these is a decision, not an oversight:
  #   - A major runtime bump. This project targets Java 21 on purpose, and Dependabot cannot know
  #     that; to it, 24 is simply newer. Moving to another LTS is a decision with a release note
  #     behind it and arrives as a hand-written pull request, not as a monthly one.
  #   - Anything about the `maven:` build-stage image. It does not ship, #288 chose not to move it,
  #     and the one proposal it produced replaced `3.9.9-eclipse-temurin-21` with
  #     `3.9-eclipse-temurin-26`: a move to Java 26, and a pin with its patch digit dropped, under
  #     a comment in server/Dockerfile saying a build cannot depend on what a floating tag means.
  #
  # Both defects arrived at once, as six pull requests nobody could merge (#290 to #295). Two
  # warnings for whoever is looking at a list of stale ones:
  #   - Do not set this entry to `open-pull-requests-limit: 0`. That is what the entries above do,
  #     and here it makes the entry do nothing: a base image is not a package in the advisory
  #     database, so a security-only configuration never raises a base-image bump.
  #   - Do not widen these ignores back. The ignores are the argument against exactly those six.
  #     To move the runtime to another major, change the Dockerfiles by hand.
  - package-ecosystem: docker
    directories:
      - "/server"
      - "/simulator"
      - "/simulator-mpesa-app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
