server:
  port: 8080

spring:
  application:
    name: nkap-server
  datasource:
    # The database connection comes from the environment, like the operator credentials.
    # The compose file (§6) will pin the server and its PostgreSQL together.
    url: ${NKAP_DB_URL:jdbc:postgresql://localhost:5432/nkap}
    username: ${NKAP_DB_USER:nkap}
    password: ${NKAP_DB_PASSWORD:nkap}
  flyway:
    # Migrations run at startup. The schema is the invariants' real home; see
    # db/migration and its hand-written inverses in db/rollback.
    locations: classpath:db/migration
  jackson:
    deserialization:
      # An amount is an integer count of minor units. "5000.0" is not that.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Exactly two, named, not a wildcard: health, for the compose file's health check,
        # and prometheus, for issue #75's gauges and counters. Everything else Actuator can
        # expose (env, beans, heapdump, mappings...) stays off — a wildcard here is how a
        # metrics endpoint accidentally becomes an environment-variable leak. There is no
        # separate auth gate on either: CallerAuthInterceptor already excludes /actuator/**
        # wholesale (see AuthWebConfig), on the strength of this being exactly two
        # low-risk, unauthenticated-by-convention reads — a liveness probe and a metrics
        # scrape, the way a Prometheus server or a health check is set up to call them.
        include:
          - health
          - prometheus
  prometheus:
    metrics:
      export:
        # Required, not optional: @ConditionalOnEnabledMetricsExport does not treat "a
        # registry is on the classpath" as "export it", and its fallback,
        # management.defaults.metrics.export.enabled, does not turn this specific registry
        # on either — confirmed against the actual condition evaluation report, not
        # assumed, after the endpoint stayed absent with only the dependency and the
        # exposure list above set. Without this line, PrometheusMetricsExportAutoConfiguration
        # never creates the PrometheusMeterRegistry the /actuator/prometheus endpoint (and
        # every gauge and counter in dev.nkap.server.metrics) needs.
        enabled: true

nkap:
  reconciler:
    # The reconciler and its scheduler. Off means UNKNOWN payments are never chased —
    # only for a deployment that runs the reconciler as a separate process, or a test.
    enabled: true
    # How often a pass runs. Too short and every tick re-queries the operator for the same
    # still-pending payments, turning the reconciler into a load generator; too long and a
    # payment that could have been resolved in seconds sits UNKNOWN for minutes.
    interval: 30s
    # The most payments one pass claims. A bound, so a backlog after an outage drains at a
    # steady rate instead of firing thousands of operator calls at once.
    batch-size: 100
    # The delay before the first retry, doubling each attempt. Too short wastes calls on
    # payments the payer simply has not approved yet; the first useful re-query is rarely
    # sooner than a minute after the timeout.
    backoff-base: 1m
    # The ceiling on a single interval, so backoff does not stretch to days. Once here, the
    # reconciler keeps checking at this cadence until the window runs out.
    backoff-max: 1h
    # How long a payment may stay UNKNOWN before it is handed to a human. This is
    # wall-clock time since the payment became UNKNOWN — measured from a timestamp on the
    # row, not inferred from how many reconciler passes have run, so a day-long outage or a
    # restart loop does not shift it. Too short escalates payments that would have resolved
    # on their own — a slow payer, an operator catching up — and trains people to wave
    # escalations away; too long leaves money that may be stuck unexamined for that whole
    # time. It is a deadline for a human to look, not a verdict: the payment stays UNKNOWN
    # either way, and a later callback or query can still resolve it.
    window: 24h
  provider:
    # The provider a POST /payments is routed to. Routing by country arrives with
    # multi-country support; for now there is one.
    default: mtn
    mtn:
      # Credentials come from the environment, never from a committed file.
      base-url: ${NKAP_PROVIDER_MTN_BASE_URL:}
      target-environment: ${NKAP_PROVIDER_MTN_TARGET_ENVIRONMENT:}
      subscription-key: ${NKAP_PROVIDER_MTN_SUBSCRIPTION_KEY:}
      api-user: ${NKAP_PROVIDER_MTN_API_USER:}
      api-key: ${NKAP_PROVIDER_MTN_API_KEY:}
      currency: ${NKAP_PROVIDER_MTN_CURRENCY:}
      country: ${NKAP_PROVIDER_MTN_COUNTRY:}
