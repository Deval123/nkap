# Four alerting rules, because thirty metrics and no guidance is a list, not an operations
# handover (issue #75). Drop this file into a Prometheus server's rule_files, or paste the
# rules into an existing rule group — nothing here depends on how Nkap itself is scraped
# beyond the metric names, which come from GET /actuator/prometheus.
#
# The rest of this project's metrics — payments by state, reconciler passes, operator
# latency and failures, ledger entries written — are real and worth graphing, but the
# roadmap is explicit that this gauge is the one alert that justifies the whole line: a
# suspense balance that does not return to zero means the operator confirmed money moved
# that Nkap could not attribute, and today that fact sits in a table nobody queries. Build
# that alert first and let the rest follow it, here as it did in the code.
groups:
  - name: nkap
    rules:
      # nkap_suspense_balance is computed live on every scrape (see
      # SuspenseBalanceMetrics) — it is never a cached value going stale unnoticed. A
      # query failure reports NaN, not zero, specifically so it cannot masquerade as a
      # healthy account: by ordinary IEEE 754 comparison rules NaN is never equal to
      # zero, so "!= 0" below catches a computation failure the same way it catches a
      # genuinely non-zero balance. That is a deliberate property of the gauge, not an
      # accident of this expression — see the class javadoc. What this rule does not
      # cover is the scrape failing entirely (the target going unreachable); that is
      # what Prometheus's own `up` metric, or `absent_over_time`, is for.
      - alert: NkapSuspenseBalanceNotZero
        expr: nkap_suspense_balance != 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Nkap suspense balance for {{ $labels.provider }}/{{ $labels.currency }} is not zero"
          description: >-
            The operator confirmed money moved that Nkap could not attribute to a
            payment, and it has stayed unresolved for at least 15 minutes. Find the
            statement import that posted it (GET /statements/imports/{id}) and the
            suspense entry it recorded; resolving it is a reversing ledger entry once
            the money is attributed to the right payment or merchant.

      # nkap_payment_escalated_total increments exactly where Reconciler logs the
      # escalation WARN, once per payment the reconciler gives up retrying
      # automatically. "increase(...) > 0" fires on the event, not on how many are
      # currently open, so a quiet window with zero escalations stays quiet.
      # reason=window_exhausted is the ordinary case, below; reason=cannot_query
      # (ADR 0014 decision 3) is a payment escalated with zero reconciler attempts
      # because its adapter cannot resolve a lost submission by polling at all.
      - alert: NkapPaymentEscalated
        expr: increase(nkap_payment_escalated_total[15m]) > 0
        labels:
          severity: page
        annotations:
          summary: "Nkap escalated a payment to a human ({{ $labels.provider }}, {{ $labels.reason }})"
          description: >-
            reason=window_exhausted: the reconciler exhausted a payment's retry window
            without a conclusive answer from the operator. reason=cannot_query: the
            payment's adapter cannot resolve a lost submission by polling and this
            payment has no provider reference to query with, so no attempt was made at
            all. Either way the payment is not FAILED — it is still open, and a later
            callback or manual query can still resolve it — but the automatic retries
            have stopped and it needs a human to look.

      # nkap_outbox_dead_lettered is computed live on every scrape (see
      # DeadLetteredEventsMetrics), the same way the suspense balance is: a query
      # failure reports NaN, not zero, so it cannot masquerade as a healthy, empty
      # backlog. No "for:" here — unlike a retry that might still resolve itself, a
      # dead-lettered event stays dead-lettered until a human replays it, so there is
      # nothing gained by waiting before paging.
      - alert: NkapOutboxDeadLettered
        expr: nkap_outbox_dead_lettered > 0
        labels:
          severity: page
        annotations:
          summary: "Nkap has a dead-lettered webhook event"
          description: >-
            The outbox relay gave up retrying at least one event: a merchant was
            never told what happened to a payment. List them with GET
            /webhooks/events/dead-lettered (admin key), and once whatever broke
            delivery is fixed, replay with POST /webhooks/events/{eventId}/replay.

      # nkap_credentials_stale_seconds exists only for an installation whose M-Pesa
      # credentials are supplied as files (see CredentialStalenessMetrics and ADR 0015).
      # A rotated file that is unreadable or invalid does not stop payments: the gateway
      # keeps the last valid credentials and serves with them. This rule is what makes that
      # visible. No "for:" because the gauge is already a duration, and the state does not
      # clear itself: until the file is fixed, the next restart fails.
      - alert: NkapCredentialsStale
        expr: nkap_credentials_stale_seconds > 0
        labels:
          severity: page
        annotations:
          summary: "Nkap is paying with stale credentials for {{ $labels.provider }}"
          description: >-
            A credential file for this installation changed and was rejected: it could
            not be read, or it failed the same check startup applies. Payments still
            succeed with the last valid credentials, and the rejected value is not used.
            The gateway log has one warning naming the file and, for an invisible
            character, which end. Fix the file. A restart before then fails.
