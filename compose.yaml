# `docker compose up` — PostgreSQL, the simulator and the gateway, built from source.
#
# This is the clone path: you check out the repository and build. Pulling a published
# image is a separate roadmap line. Once the stack is up, run the demo:
#
#     docker compose up --build -d
#     ./examples/demo.sh
#
# Nothing in this file is a secret. The MTN values are placeholders that point the
# gateway at the simulator; a real deployment supplies its own through the environment.
#
# Callers are authenticated (issue #59): POST /payments needs an API key. Keys are
# provisioned by a host-side command, never a route. The `key-init` service below runs
# that command once, before the gateway starts, to create ONE obviously-named demo key
# --- `nkap_demo-key-not-for-production` for merchant `acme` --- so the demo has a
# credential. A real deployment provisions its own with:
#
#     docker compose run --rm gateway --nkap.apikey.create --nkap.apikey.merchant=<id>
#
# and reads the key off stdout once; it is stored only as a hash and cannot be recovered.

name: nkap

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: nkap
      POSTGRES_USER: nkap
      # Not a secret: this database holds a demo and is not reachable from outside the
      # compose network (no published port). A real deployment sets its own.
      POSTGRES_PASSWORD: nkap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkap -d nkap"]
      interval: 2s
      timeout: 3s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/_nkap/scenarios"]
      interval: 2s
      timeout: 3s
      retries: 40

  # One-shot: provision the demo API key, then exit. Runs the same jar as the gateway with
  # the provisioning command (--nkap.apikey.create), which starts no web server. Idempotent
  # — re-running `docker compose up` does not fail on the key already existing. The token is
  # fixed and obviously a demo one; a real deployment never passes --nkap.apikey.token.
  key-init:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NKAP_DB_URL: jdbc:postgresql://db:5432/nkap
      NKAP_DB_USER: nkap
      NKAP_DB_PASSWORD: nkap
      # The provisioning command builds the full context, which wires an MTN adapter bean;
      # these placeholders keep that construction happy. Nothing here calls the operator.
      NKAP_PROVIDER_MTN_CM_BASE_URL: http://simulator:8081
      NKAP_PROVIDER_MTN_CM_TARGET_ENVIRONMENT: sandbox
      NKAP_PROVIDER_MTN_CM_SUBSCRIPTION_KEY: placeholder-not-a-real-subscription-key
      NKAP_PROVIDER_MTN_CM_API_USER: placeholder-not-a-real-api-user
      NKAP_PROVIDER_MTN_CM_API_KEY: placeholder-not-a-real-api-key
      # A one-shot command has no use for the reconciler's scheduler.
      NKAP_RECONCILER_ENABLED: "false"
    command:
      - "--nkap.apikey.create"
      - "--nkap.apikey.merchant=acme"
      - "--nkap.apikey.label=demo"
      - "--nkap.apikey.token=nkap_demo-key-not-for-production"
    restart: "no"

  # One-shot: provision a demo webhook endpoint, then exit. Same shape as key-init, and the
  # same reason it is a command rather than a route: a route that lets a caller point a
  # signing secret at an arbitrary URL is worse than one that writes ledger entries.
  #
  # The url is https, on purpose: provisioning refuses anything else (issue #77's second
  # defect — a typo giving http:// would send a signed payment notification in clear text).
  # example.invalid is a reserved domain that never resolves (RFC 2606) — nothing in this
  # compose file receives the webhook, and nothing needs to; this step exists to prove
  # provisioning itself still works end to end after that check landed, not to demonstrate
  # delivery. examples/demo.sh asserts the row this leaves behind.
  webhook-init:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NKAP_DB_URL: jdbc:postgresql://db:5432/nkap
      NKAP_DB_USER: nkap
      NKAP_DB_PASSWORD: nkap
      # The provisioning command builds the full context, which wires an MTN adapter bean;
      # these placeholders keep that construction happy. Nothing here calls the operator.
      NKAP_PROVIDER_MTN_CM_BASE_URL: http://simulator:8081
      NKAP_PROVIDER_MTN_CM_TARGET_ENVIRONMENT: sandbox
      NKAP_PROVIDER_MTN_CM_SUBSCRIPTION_KEY: placeholder-not-a-real-subscription-key
      NKAP_PROVIDER_MTN_CM_API_USER: placeholder-not-a-real-api-user
      NKAP_PROVIDER_MTN_CM_API_KEY: placeholder-not-a-real-api-key
      # A one-shot command has no use for the reconciler's or the relay's scheduler.
      NKAP_RECONCILER_ENABLED: "false"
      NKAP_WEBHOOKS_ENABLED: "false"
    command:
      - "--nkap.webhook.create"
      - "--nkap.webhook.merchant=acme"
      - "--nkap.webhook.url=https://example.invalid/hooks"
      - "--nkap.webhook.secret=whsec_demo-secret-not-for-production"
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      # Not "the container exists" — "the service answers". A first run that fails and
      # works on the second is a first impression you do not get back.
      db:
        condition: service_healthy
      simulator:
        condition: service_healthy
      key-init:
        condition: service_completed_successfully
      webhook-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      NKAP_DB_URL: jdbc:postgresql://db:5432/nkap
      NKAP_DB_USER: nkap
      NKAP_DB_PASSWORD: nkap

      # The MTN profile, pointed at the simulator. PLACEHOLDERS, not secrets — named so
      # nobody mistakes them for something to keep. A real deployment provides real ones
      # through these same environment variables. Cameroon (mtn-cm) is the primary
      # installation this demo's own payment runs against — see examples/demo.sh.
      NKAP_PROVIDER_MTN_CM_BASE_URL: http://simulator:8081
      NKAP_PROVIDER_MTN_CM_TARGET_ENVIRONMENT: sandbox
      NKAP_PROVIDER_MTN_CM_SUBSCRIPTION_KEY: placeholder-not-a-real-subscription-key
      NKAP_PROVIDER_MTN_CM_API_USER: placeholder-not-a-real-api-user
      NKAP_PROVIDER_MTN_CM_API_KEY: placeholder-not-a-real-api-key

      # A second installation (issue #82): application.yml declares a second slot, blank by
      # default (so a single-country deployment leaves it alone and gets one adapter, not a
      # startup failure). NKAP_PROVIDER_MTN_GH_COUNTRY is what turns it on; the rest are its
      # own credentials — the same simulator, since one operator with two accounts at it is
      # the point here, not a second fake operator.
      NKAP_PROVIDER_MTN_GH_COUNTRY: gh
      NKAP_PROVIDER_MTN_GH_BASE_URL: http://simulator:8081
      NKAP_PROVIDER_MTN_GH_TARGET_ENVIRONMENT: sandbox
      NKAP_PROVIDER_MTN_GH_SUBSCRIPTION_KEY: placeholder-not-a-real-ghana-subscription-key
      NKAP_PROVIDER_MTN_GH_API_USER: placeholder-not-a-real-ghana-api-user
      NKAP_PROVIDER_MTN_GH_API_KEY: placeholder-not-a-real-ghana-api-key

      # Disbursements is a separate MTN product with its own credentials (issue #62). Same
      # placeholders, same simulator; set so a POST /payments with "operation":"DISBURSE"
      # works against the demo stack. A deployment that only collects leaves these unset.
      # Cameroon's only — Ghana is here to demonstrate routing, not every product.
      NKAP_PROVIDER_MTN_CM_DISBURSEMENT_SUBSCRIPTION_KEY: placeholder-not-a-real-disbursement-subscription-key
      NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_USER: placeholder-not-a-real-disbursement-api-user
      NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_KEY: placeholder-not-a-real-disbursement-api-key

      # Demo-only cadence, set here rather than in application.yml. The defaults there were
      # chosen for a real deployment and their comments explain why; a fast loop makes the
      # demo watchable in one sitting without pretending the production values are wrong.
      #  - request-timeout: a submission that never answers should turn into UNKNOWN in
      #    seconds here, not the 20s a real client would wait.
      #  - the reconciler runs every few seconds with a few-second backoff, so the payment
      #    resolves while someone is still watching the terminal.
      #  - window is minutes, not a day, but still far longer than the demo runs — the demo
      #    shows resolution, not escalation.
      NKAP_PROVIDER_MTN_CM_REQUEST_TIMEOUT: PT2S
      NKAP_RECONCILER_INTERVAL: PT3S
      NKAP_RECONCILER_BACKOFF_BASE: PT3S
      NKAP_RECONCILER_BACKOFF_MAX: PT10S
      NKAP_RECONCILER_WINDOW: PT2M
    # Health and metrics answer on their own port (9464, application.yml), and this file
    # never publishes it — only 8080, the API, is mapped to the host below. The check
    # still reaches it: this runs inside the container, on the compose network, where the
    # unpublished port is exactly as reachable as the published one. If you move the
    # health check back to 8080 by habit, it breaks — the good kind of failure.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9464/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 40
