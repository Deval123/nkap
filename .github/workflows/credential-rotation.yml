name: credential-rotation

# Proves on a real cluster that a rotated M-Pesa Secret reaches the operator (issue #240, ADR
# 0015): the gateway installed from charts/nkap with its credentials mounted as files, the Secret
# patched, and the next submission's Password and token computed from the new values. The work is
# .github/scripts/kind-credential-rotation.sh, which also runs by hand; this file only decides
# when it runs.
#
# Its own workflow, not a job in build.yml, because every build.yml job runs on every push and
# pull request, and this one builds two images, loads them into a kind cluster, starts PostgreSQL
# and installs a chart: minutes, not seconds. It runs on main, by hand, and on the pull requests
# that touch what it proves. A defect in the re-read path is found before a merge or it is not
# found, which is the whole argument for this job existing.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      # The chart that mounts the Secret.
      - "charts/**"
      # The credential reading and re-read code, and the gauge the job reads.
      - "server/src/main/java/dev/nkap/server/provider/CredentialFileReader.java"
      - "server/src/main/java/dev/nkap/server/provider/RereadMpesaProfile.java"
      - "server/src/main/java/dev/nkap/server/provider/MpesaConfiguration.java"
      - "server/src/main/java/dev/nkap/server/metrics/CredentialStalenessMetrics.java"
      - "server/src/main/resources/application.yml"
      # What sends the Password and fetches the token.
      - "provider-mpesa/src/main/**"
      # The simulator that records what arrived, and the core it is built on.
      - "simulator-mpesa*/**"
      - "simulator-core/**"
      # This job itself.
      - ".github/kind/credential-rotation/**"
      - ".github/scripts/kind-credential-rotation.sh"
      - ".github/workflows/credential-rotation.yml"

permissions:
  contents: read

jobs:
  rotation:
    runs-on: ubuntu-latest
    # A hang must not run for hours. A run takes a few minutes; the rotation wait alone is bounded
    # at five, inside the script.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: "v4.3.0"
      # install_only: the script creates, and deletes, the cluster it runs in, so a local run and
      # this one go through the same lines.
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Rotate a mounted Secret and watch the operator receive the new credentials
        run: .github/scripts/kind-credential-rotation.sh
