# PostgreSQL for the credential-rotation job (.github/workflows/credential-rotation.yml), and for
# nothing else. A plain Deployment and Service rather than a third-party chart: the gateway's
# chart deploys no database and wants `database.host`, and one less moving part is one less way
# for this job to fail for a reason that is not its subject. No volume: the cluster lives for one
# run. The password comes from the same Secret the chart reads, nkap-db, which the job creates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16.6-alpine
          env:
            - name: POSTGRES_DB
              value: nkap
            - name: POSTGRES_USER
              value: nkap
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nkap-db
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nkap", "-d", "nkap"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
