server:
  port: 8080

spring:
  application:
    name: nkap-server
  config:
    # A second source for the same names as the environment variables below: a file in this
    # directory named exactly like a variable (NKAP_PROVIDER_MPESA_KE_PASSKEY, NKAP_DB_PASSWORD)
    # feeds the same placeholder the variable would. /run/secrets is where compose's `secrets:`
    # puts them; NKAP_SECRETS_DIR moves it. `optional:` because a deployment that uses variables
    # alone has no such directory, and must start exactly as before.
    #
    # Read once, at startup, like the variables: replacing a file takes a restart. One name as
    # both a variable and a file fails startup (CredentialSourceGuard), and so does a file for a
    # slot declared nowhere below (ProviderSlotGuard). Only the exact, upper-case name is read.
    #
    # One trailing newline is removed: \n or \r\n, what `echo value > FILE` writes. Measured
    # against a real jar, on what a stub operator received. Nothing else is trimmed — a trailing space, or two
    # trailing newlines, reach the operator as part of the credential. examples/compose-secrets/
    # holds both shapes on purpose, and CredentialFilesTest keeps the one-newline answer true.
    import: optional:configtree:${NKAP_SECRETS_DIR:/run/secrets}/
  datasource:
    # The database connection comes from the environment, like the operator credentials.
    # The compose file (§6) will pin the server and its PostgreSQL together.
    url: ${NKAP_DB_URL:jdbc:postgresql://localhost:5432/nkap}
    username: ${NKAP_DB_USER:nkap}
    password: ${NKAP_DB_PASSWORD:nkap}
  flyway:
    # Migrations run at startup. The schema is the invariants' real home; see
    # db/migration and its hand-written inverses in db/rollback.
    locations: classpath:db/migration
  jackson:
    deserialization:
      # An amount is an integer count of minor units. "5000.0" is not that.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

management:
  server:
    # A separate port, and this file never publishes it — compose.yaml does not map it to
    # the host, and a real deployment reaches it only from inside its own network. Health
    # and metrics were justified as "unauthenticated by convention" when health was the
    # only thing here; that convention assumes a management port a scraper reaches on an
    # internal network, not the same port that serves the public API. Now that this port
    # also carries payments-by-state, reconciler passes and escalations, operator latency,
    # and the suspense balance in a real currency — and, since issue #113, the list of
    # escalated payments by reference and merchant, the first row-level rather than
    # aggregate data here — putting it behind the API's own published port would hand that
    # business volume, and now those specific references, to anyone who can reach the
    # gateway. 9464 is the OpenTelemetry Prometheus exporter's conventional default — not
    # load-bearing here, just a recognisable, unlikely-to-collide choice.
    port: 9464
  endpoints:
    web:
      exposure:
        # Exactly three, named, not a wildcard: health, for the compose file's health check;
        # prometheus, for issue #75's gauges and counters; and escalatedPayments (issue
        # #113), the one route to the list nkap_payment_escalated_total's rise otherwise
        # gives no way to reach (dev.nkap.server.management.EscalatedPaymentsEndpoint).
        # Everything else Actuator can expose (env, beans, heapdump, mappings...) stays off —
        # a wildcard here is how a metrics endpoint accidentally becomes an
        # environment-variable leak. All three are reachable only on the management port
        # above; there is no separate auth gate on any of them.
        include:
          - health
          - prometheus
          - escalatedPayments
  prometheus:
    metrics:
      export:
        # Required, not optional: @ConditionalOnEnabledMetricsExport does not treat "a
        # registry is on the classpath" as "export it", and its fallback,
        # management.defaults.metrics.export.enabled, does not turn this specific registry
        # on either — confirmed against the actual condition evaluation report, not
        # assumed, after the endpoint stayed absent with only the dependency and the
        # exposure list above set. Without this line, PrometheusMetricsExportAutoConfiguration
        # never creates the PrometheusMeterRegistry the /actuator/prometheus endpoint (and
        # every gauge and counter in dev.nkap.server.metrics) needs.
        enabled: true

nkap:
  reconciler:
    # The reconciler and its scheduler. Off means UNKNOWN payments are never chased —
    # only for a deployment that runs the reconciler as a separate process, or a test.
    enabled: true
    # How often a pass runs. Too short and every tick re-queries the operator for the same
    # still-pending payments, turning the reconciler into a load generator; too long and a
    # payment that could have been resolved in seconds sits UNKNOWN for minutes.
    interval: 30s
    # The most payments one pass claims. A bound, so a backlog after an outage drains at a
    # steady rate instead of firing thousands of operator calls at once.
    batch-size: 100
    # The delay before the first retry, doubling each attempt. Too short wastes calls on
    # payments the payer simply has not approved yet; the first useful re-query is rarely
    # sooner than a minute after the timeout.
    backoff-base: 1m
    # The ceiling on a single interval, so backoff does not stretch to days. Once here, the
    # reconciler keeps checking at this cadence until the window runs out.
    backoff-max: 1h
    # How long a payment may stay UNKNOWN before it is handed to a human. This is
    # wall-clock time since the payment became UNKNOWN — measured from a timestamp on the
    # row, not inferred from how many reconciler passes have run, so a day-long outage or a
    # restart loop does not shift it. Too short escalates payments that would have resolved
    # on their own — a slow payer, an operator catching up — and trains people to wave
    # escalations away; too long leaves money that may be stuck unexamined for that whole
    # time. It is a deadline for a human to look, not a verdict: the payment stays UNKNOWN
    # either way, and a later callback or query can still resolve it.
    window: 24h
    # How long a refund (issue #84) may sit in CREATED -- its reservation on the original
    # committed, but the process was killed before the transfer was ever submitted, or
    # before that call's outcome was recorded -- before this reconciler moves it to UNKNOWN
    # and starts chasing it the same as any other unresolved payment. Ordinary CREATED
    # payments are untouched; this is refund-specific. Generous on purpose: a submit call
    # normally resolves in seconds, so nothing legitimate is ever this slow, and being slow
    # to notice a genuine crash costs nothing a stuck refund was not already going to sit
    # through — it is otherwise inert forever.
    stranded-refund-grace: 2m
  webhooks:
    # The outbox relay and its scheduler (issue #77). Off means events pile up, signed and
    # ready, but never sent — only for a deployment that runs the relay as a separate
    # process, or a test.
    enabled: true
    # How often a pass runs. Same trade-off as the reconciler's interval: too short turns
    # the relay into a load generator against receivers that are simply slow; too long and
    # a merchant waiting on a webhook waits longer than it had to.
    interval: 10s
    # The most events one pass claims. A bound, so a backlog after a receiver outage drains
    # at a steady rate instead of opening thousands of connections at once.
    batch-size: 100
    # The delay before the first retry, doubling each attempt after that.
    backoff-base: 30s
    # The ceiling on a single interval, so backoff does not stretch to days.
    backoff-max: 30m
    # The attempt past which an event is dead-lettered rather than retried again. Unlike
    # the reconciler's window, this is a count, not wall-clock time: an unreachable
    # receiver is a merchant-side outage, not a payment left unresolved, and what stops
    # retrying is found on the merchant's console (or replayed via the admin API), not
    # paged to a human the way an escalation is.
    max-attempts: 10
    # How long one delivery attempt may take before it counts as a failure. Bounded so a
    # receiver that never answers costs one slow attempt, not a stuck relay pass — the
    # same reason the MTN adapters bound their own request timeout.
    request-timeout: 5s
    # How far a signed request's timestamp may drift from "now" before a receiver
    # following the verification recipe in docs/webhooks.md must refuse it. This gateway
    # only signs — it never reads this tolerance itself — but it is configured here,
    # alongside everything else about a delivery, and documented for whoever implements
    # the receiving side.
    signature-tolerance: 5m
    # Provisioning refuses anything but https by default: this is a signed notification
    # about money, and the signature protects integrity, not confidentiality — plain http
    # leaves the amount, the reference and the merchant readable to anything on the path.
    # Set true only for a local demo or a test with no TLS in front of it; a real
    # deployment never sets this.
    allow-insecure-endpoint-url: false
  # The host this deployment is reachable at from the internet, so MTN's own callback (issue
  # #116) has somewhere real to reach. Nkap composes the rest itself: <public-base-url>
  # /callbacks/<providerId>, the path docs/openapi.yaml defines, so a deployment only ever
  # spells its own host once, and never a full callback URL per installation.
  #
  # Unset (the default) means no X-Callback-Url header is ever sent, and MTN never calls
  # back at all — a real payment still settles, resolved by the reconciler instead, only
  # slower. Set but not an absolute URL fails the application at startup, not the first
  # payment. Setting it is also an operational commitment: MTN's providerCallbackHost is an
  # allow-list fixed at API-user creation and must name this same host, or every submission
  # fails with INVALID_CALLBACK_URL_HOST (docs/providers/mtn.md).
  #
  # Optional for MTN, required by M-Pesa: a configured M-Pesa installation (below) fails
  # startup without it, because its callback is the only way it resolves a lost submission.
  public-base-url: ${NKAP_PUBLIC_BASE_URL:}
  provider:
    # The provider GET /balance and GET /account-holders/{msisdn} route to — those two
    # routes are not per-country (issue #82's "not in this slice"); POST /payments names
    # its own country on every request instead. Defaults to the literal mtn-cm, whatever is
    # configured below, and mtn-cm exists only when NKAP_PROVIDER_MTN_CM_COUNTRY=cm. When
    # any provider is configured, the gateway refuses to start if this names none of them
    # (DefaultProviderCheck); with none configured there is nothing to contradict, and it
    # starts.
    default: ${NKAP_PROVIDER_DEFAULT:mtn-cm}
    mtn:
      # Several country installations in one deployment (issue #82): a list, one entry per
      # country, each registered as mtn-<country> (see MtnConfiguration) so POST
      # /payments's country field routes to it directly. Credentials come from the
      # environment, never from a committed file.
      #
      # A slot with a blank country is not an installation — MtnConfiguration skips it,
      # the same way an unset nkap.provider.mtn.*.disbursement.* block is not a configured
      # product. A deployment that serves only Cameroon leaves the second slot's env vars
      # unset and gets one adapter, not a startup failure over credentials it does not
      # have. Every slot's country defaults to blank, Cameroon's included: a declared slot
      # must not make the gateway fail to start, so a deployment that sets no provider
      # variable at all starts with no adapter, and one that wants Cameroon says so with
      # NKAP_PROVIDER_MTN_CM_COUNTRY=cm.
      #
      # (A raw indexed environment variable — NKAP_PROVIDER_MTN_INSTALLATIONS_1_API_KEY
      # — was tried and rejected: Spring's relaxed binding cannot reliably tell "api" + "key"
      # from a nested "api.key" without a YAML key already naming the field, and silently
      # fails the whole list element when it guesses wrong. Both slots declared here, with
      # named placeholders, sidesteps that guesswork entirely.)
      #
      # (Its sibling, also measured against a real jar and also rejected: credential files named
      # after the bound property, nkap.provider.mpesa.installations[0].passkey, through the
      # config tree imported above. Such a file does bind, brackets and index intact — but Spring
      # does not merge list elements across property sources. It takes the whole list from the
      # highest-ranked source holding any element of it, and the config tree outranks this file.
      # So one credential file replaced this list with a single element carrying that one
      # property: the country went blank, the installation was skipped, and the gateway started
      # cleanly without it. Files are therefore named after the variables instead, and feed the
      # placeholders here field by field, leaving this list built from one source.)
      installations:
        - base-url: ${NKAP_PROVIDER_MTN_CM_BASE_URL:}
          target-environment: ${NKAP_PROVIDER_MTN_CM_TARGET_ENVIRONMENT:}
          subscription-key: ${NKAP_PROVIDER_MTN_CM_SUBSCRIPTION_KEY:}
          api-user: ${NKAP_PROVIDER_MTN_CM_API_USER:}
          api-key: ${NKAP_PROVIDER_MTN_CM_API_KEY:}
          currency: ${NKAP_PROVIDER_MTN_CM_CURRENCY:XAF}
          country: ${NKAP_PROVIDER_MTN_CM_COUNTRY:}
          request-timeout: ${NKAP_PROVIDER_MTN_CM_REQUEST_TIMEOUT:PT20S}
          disbursement:
            subscription-key: ${NKAP_PROVIDER_MTN_CM_DISBURSEMENT_SUBSCRIPTION_KEY:}
            api-user: ${NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_USER:}
            api-key: ${NKAP_PROVIDER_MTN_CM_DISBURSEMENT_API_KEY:}
        - base-url: ${NKAP_PROVIDER_MTN_GH_BASE_URL:}
          target-environment: ${NKAP_PROVIDER_MTN_GH_TARGET_ENVIRONMENT:}
          subscription-key: ${NKAP_PROVIDER_MTN_GH_SUBSCRIPTION_KEY:}
          api-user: ${NKAP_PROVIDER_MTN_GH_API_USER:}
          api-key: ${NKAP_PROVIDER_MTN_GH_API_KEY:}
          currency: ${NKAP_PROVIDER_MTN_GH_CURRENCY:GHS}
          country: ${NKAP_PROVIDER_MTN_GH_COUNTRY:}
    mpesa:
      # Safaricom's Daraja STK Push, collections only (issue #215): no disbursement block,
      # because the adapter does nothing else. Each installation is registered as
      # mpesa-<country>, so POST /payments's country field routes to it, exactly as for MTN
      # above. Credentials come from the environment, never from a committed file, and a
      # slot with a blank country is skipped. Named placeholders per slot, not raw indexed
      # environment variables, for the reason given at nkap.provider.mtn above.
      #
      # One slot, Kenya, on purpose. MTN's two slots assume several countries behind one API.
      # For M-Pesa that is exactly what nobody has checked: docs/providers/m-pesa.md lists
      # under Still unknown whether a second API family sits under the same commercial name,
      # and if one does, "one adapter per operator" (ADR 0009) stops describing what is built.
      # A second slot here would be this file asserting what that page records as unknown. It
      # is earned the day someone reads a Safaricom or Vodacom page that settles the question.
      #
      # The country defaults to blank, unlike MTN's first slot: configuring this installation
      # makes nkap.public-base-url mandatory, and a deployment that never asked for M-Pesa
      # must not start failing over it. Set NKAP_PROVIDER_MPESA_KE_COUNTRY=ke to turn it on.
      #
      # The passkey is not a key in MTN's sense; see docs/security-notes.md before rotating it.
      installations:
        - base-url: ${NKAP_PROVIDER_MPESA_KE_BASE_URL:}
          business-short-code: ${NKAP_PROVIDER_MPESA_KE_BUSINESS_SHORT_CODE:}
          passkey: ${NKAP_PROVIDER_MPESA_KE_PASSKEY:}
          consumer-key: ${NKAP_PROVIDER_MPESA_KE_CONSUMER_KEY:}
          consumer-secret: ${NKAP_PROVIDER_MPESA_KE_CONSUMER_SECRET:}
          currency: ${NKAP_PROVIDER_MPESA_KE_CURRENCY:KES}
          country: ${NKAP_PROVIDER_MPESA_KE_COUNTRY:}
          request-timeout: ${NKAP_PROVIDER_MPESA_KE_REQUEST_TIMEOUT:PT20S}
